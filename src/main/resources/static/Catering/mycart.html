<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Cart - Our Catering Service</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #ffd89b, #19547b);
    }

    .navbar {
      background-color: #000;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .nav-links a {
      margin: 0 10px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    .contact-details {
      font-size: 0.9rem;
    }

    .cart {
      max-width: 650px;
      margin: 60px auto;
      padding: 20px;
      background: #ffffffcc;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .cart h2 {
      color: #000;
      text-align: center;
    }

    .empty-msg {
      text-align: center;
      color: #888;
      font-size: 1rem;
      margin: 20px 0;
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    li {
      margin: 10px 0;
      padding: 10px 14px;
      background-color: #fff;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .item-name {
      font-weight: bold;
      color: #333;
    }

    .item-meta {
      font-size: 0.8rem;
      color: #888;
    }

    .item-price {
      font-weight: bold;
      color: #4a148c;
      white-space: nowrap;
      margin-left: 10px;
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-controls button {
      background-color: #8e24aa;
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      line-height: 1;
    }

    .qty-controls button:hover {
      background-color: #6a1b9a;
    }

    .qty-num {
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }

    button.remove-btn {
      background-color: #e53935;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    button.remove-btn:hover {
      background-color: #c62828;
    }

    #total {
      font-size: 1.2rem;
      font-weight: bold;
      color: #d32f2f;
      text-align: right;
      margin-top: 15px;
    }

    .clear-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background-color: #f4511e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .clear-btn:hover {
      background-color: #bf360c;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">🍽️ Our Catering Service</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="catering-events.html">Catering Events</a>
      <a href="services.html">Services</a>
      <a href="mycart.html">My Cart</a>
    </div>
    <div class="contact-details">
      📞 Phone: 9876543210 | 📧 Email: contact@ourcatering.com
    </div>
  </div>

  <div class="cart">
    <h2>🛒 Your Cart</h2>
    <ul id="cartItems"></ul>
    <p id="total">Total: ₹0.00</p>
    <button class="clear-btn" onclick="clearCart()">🗑️ Clear Cart</button>
  </div>

  <script>
    // Read cart from localStorage — same key 'cart' used by services.html
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function renderCart() {
      const cartList = document.getElementById("cartItems");
      const totalDisplay = document.getElementById("total");
      cartList.innerHTML = "";
      let total = 0;

      if (cart.length === 0) {
        cartList.innerHTML = '<li class="empty-msg">Your cart is empty. <a href="services.html">Go add some items!</a></li>';
        totalDisplay.textContent = "Total: ₹0.00";
        return;
      }

      cart.forEach((item, index) => {
        const qty = item.quantity || 1;
        const itemTotal = item.price * qty;
        total += itemTotal;

        const li = document.createElement("li");
        li.innerHTML = `
          <div class="item-info">
            <span class="item-name">${item.name}</span>
            ${item.caterer ? `<span class="item-meta">📍 ${item.location || ''} &nbsp;|&nbsp; 🍴 ${item.caterer}</span>` : ''}
          </div>
          <div class="item-right">
            <div class="qty-controls">
              <button onclick="changeQty(${index}, -1)">−</button>
              <span class="qty-num">${qty}</span>
              <button onclick="changeQty(${index}, 1)">+</button>
            </div>
            <span class="item-price">₹${itemTotal.toFixed(2)}</span>
            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
          </div>
        `;
        cartList.appendChild(li);
      });

      totalDisplay.textContent = `Total: ₹${total.toFixed(2)}`;
    }

    function changeQty(index, delta) {
      cart[index].quantity = (cart[index].quantity || 1) + delta;
      if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
      }
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }

    function clearCart() {
      if (confirm("Are you sure you want to clear your entire cart?")) {
        cart = [];
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }
    }

    window.onload = renderCart;
  </script>
</body>
</html>
