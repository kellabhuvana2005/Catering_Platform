<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Catering Services</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ffe29f, #ffa99f);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #4a148c;
      font-size: 2.5rem;
      margin-bottom: 20px;
      text-shadow: 1px 1px 2px #fff;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #ffffffcc;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    label {
      font-weight: bold;
      color: #6a1b9a;
    }

    select {
      width: 100%;
      padding: 12px;
      margin: 10px 0 20px;
      border: 2px solid #ba68c8;
      border-radius: 10px;
      font-size: 16px;
      background-color: #f9f9f9;
      transition: 0.3s ease;
    }

    select:focus {
      border-color: #8e24aa;
      outline: none;
    }

    select:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading-msg {
      color: #8e24aa;
      font-style: italic;
      font-size: 0.9rem;
      margin: -10px 0 10px;
    }

    .error-msg {
      color: #c62828;
      font-size: 0.9rem;
      background: #ffebee;
      padding: 8px 12px;
      border-radius: 8px;
      margin: -10px 0 10px;
    }

    .caterer-description {
      font-size: 0.85rem;
      color: #666;
      margin: -15px 0 15px;
      padding: 8px 12px;
      background: #f3e5f5;
      border-left: 3px solid #8e24aa;
      border-radius: 0 8px 8px 0;
    }

    .menu-item {
      background: #fff3e0;
      padding: 12px;
      margin: 10px 0;
      border-radius: 15px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.3s ease;
    }

    .menu-item:hover {
      background-color: #ffe0b2;
    }

    .menu-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .menu-item-name {
      font-weight: bold;
      color: #333;
    }

    .menu-item-desc {
      font-size: 0.78rem;
      color: #777;
    }

    .menu-item-category {
      font-size: 0.75rem;
      color: #8e24aa;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .menu-item-price {
      font-weight: bold;
      color: #4a148c;
      white-space: nowrap;
      margin: 0 12px;
    }

    .menu-item button {
      background: #ff7043;
      color: white;
      border: none;
      padding: 8px 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      white-space: nowrap;
    }

    .menu-item button:hover {
      background: #f4511e;
    }

    .cart {
      margin-top: 30px;
      padding: 20px;
      background: #e1bee7;
      border-radius: 15px;
    }

    .cart h2 {
      color: #4a148c;
    }

    ul {
      padding-left: 20px;
      list-style-type: square;
    }

    ul li {
      margin: 5px 0;
    }

    #total {
      font-size: 1.3rem;
      color: #d32f2f;
    }

    .cart-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .place-order-btn {
      flex: 1;
      padding: 12px 24px;
      background-color: #8e24aa;
      color: white;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.3s;
    }

    .place-order-btn:hover {
      background-color: #6a1b9a;
    }

    .view-cart-btn {
      flex: 1;
      padding: 12px 24px;
      background-color: #4a148c;
      color: white;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    .view-cart-btn:hover {
      background-color: #38006b;
    }

    /* Menu category group headers */
    .category-header {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8e24aa;
      margin: 18px 0 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #ce93d8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍽️ Choose Your Catering Service</h1>

    <!-- Location Selector -->
    <label for="location">📍 Select Location:</label>
    <select id="location" onchange="onLocationChange()" disabled>
      <option value="">-- Loading Locations... --</option>
    </select>
    <div id="locationStatus" class="loading-msg">Loading locations from server…</div>

    <!-- Caterer Selector -->
    <div id="catererSection" style="display:none;">
      <label for="caterers">🍴 Select Caterer:</label>
      <select id="caterers" onchange="onCatererChange()" disabled>
        <option value="">-- Select Caterer --</option>
      </select>
      <div id="catererDescription" class="caterer-description" style="display:none;"></div>
    </div>

    <!-- Menu Items -->
    <div id="menuSection"></div>

    <!-- Cart Preview -->
    <div class="cart">
      <h2>🛒 Your Cart</h2>
      <ul id="cartItems"></ul>
      <p><strong>Total:</strong> ₹<span id="total">0.00</span></p>
      <div class="cart-actions">
        <a class="view-cart-btn" href="mycart.html">🛍️ View My Cart</a>
        <button class="place-order-btn" onclick="placeOrder()">✅ Place Order</button>
      </div>
    </div>
  </div>

  <script>
    // ─── State ──────────────────────────────────────────────────────────────────
    // Retrieve cart from localStorage or initialize empty
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    // In-memory catalog cache (populated from API)
    let locationsData = [];       // [{id, name, code, city, catererCount}, ...]
    let caterersByLocation = [];  // [{id, name, description, ...}, ...]
    let menuItemsForCaterer = []; // [{id, name, price, category, description, available}, ...]

    // Track currently selected caterer object for display
    let selectedCatererObj = null;

    // ─── Bootstrap: Load Locations from API ─────────────────────────────────────
    document.addEventListener("DOMContentLoaded", () => {
      fetchLocations();
      updateCartDisplay();
    });

    async function fetchLocations() {
      const locationSelect = document.getElementById("location");
      const locationStatus = document.getElementById("locationStatus");

      try {
        const response = await fetch("/api/locations");
        if (!response.ok) throw new Error(`Server error: ${response.status}`);

        locationsData = await response.json();

        locationSelect.innerHTML = '<option value="">-- Select Location --</option>';
        locationsData.forEach(loc => {
          const option = document.createElement("option");
          option.value = loc.code;          // use code ("kukatpally") as value
          option.dataset.id = loc.id;
          option.textContent = `${loc.name}`;
          locationSelect.appendChild(option);
        });

        locationSelect.disabled = false;
        locationStatus.style.display = "none";
      } catch (err) {
        locationStatus.textContent = `⚠️ Failed to load locations: ${err.message}`;
        locationStatus.className = "error-msg";
        locationSelect.disabled = false;
        console.error("fetchLocations error:", err);
      }
    }

    // ─── Location Changed: Load Caterers ────────────────────────────────────────
    async function onLocationChange() {
      const locationSelect = document.getElementById("location");
      const selectedOption = locationSelect.options[locationSelect.selectedIndex];
      const code = locationSelect.value;

      const catererSection = document.getElementById("catererSection");
      const catererSelect = document.getElementById("caterers");
      const catererDescription = document.getElementById("catererDescription");
      const menuSection = document.getElementById("menuSection");

      // Reset downstream
      catererSection.style.display = "none";
      catererDescription.style.display = "none";
      menuSection.innerHTML = "";
      selectedCatererObj = null;

      if (!code) return;

      catererSelect.innerHTML = '<option value="">-- Loading Caterers... --</option>';
      catererSelect.disabled = true;
      catererSection.style.display = "block";

      try {
        const response = await fetch(`/api/locations/${encodeURIComponent(code)}/caterers`);
        if (!response.ok) throw new Error(`Server error: ${response.status}`);

        caterersByLocation = await response.json();

        catererSelect.innerHTML = '<option value="">-- Select Caterer --</option>';
        caterersByLocation.forEach(caterer => {
          const option = document.createElement("option");
          option.value = caterer.id;
          option.textContent = caterer.name;
          catererSelect.appendChild(option);
        });

        catererSelect.disabled = false;
      } catch (err) {
        catererSelect.innerHTML = `<option value="">⚠️ Failed to load caterers</option>`;
        catererSelect.disabled = false;
        console.error("onLocationChange error:", err);
      }
    }

    // ─── Caterer Changed: Load Menu Items ───────────────────────────────────────
    async function onCatererChange() {
      const catererId = document.getElementById("caterers").value;
      const catererDescription = document.getElementById("catererDescription");
      const menuSection = document.getElementById("menuSection");

      menuSection.innerHTML = "";
      catererDescription.style.display = "none";
      selectedCatererObj = null;

      if (!catererId) return;

      // Show caterer description
      const catererObj = caterersByLocation.find(c => String(c.id) === String(catererId));
      if (catererObj) {
        selectedCatererObj = catererObj;
        if (catererObj.description) {
          catererDescription.textContent = `ℹ️ ${catererObj.description}`;
          catererDescription.style.display = "block";
        }
      }

      menuSection.innerHTML = `<p class="loading-msg">Loading menu…</p>`;

      try {
        const response = await fetch(`/api/caterers/${catererId}/menu`);
        if (!response.ok) throw new Error(`Server error: ${response.status}`);

        menuItemsForCaterer = await response.json();

        if (menuItemsForCaterer.length === 0) {
          menuSection.innerHTML = `<p style="color:#888;">No menu items available for this caterer.</p>`;
          return;
        }

        renderMenu(menuItemsForCaterer, catererObj ? catererObj.name : "");
      } catch (err) {
        menuSection.innerHTML = `<p class="error-msg">⚠️ Failed to load menu: ${err.message}</p>`;
        console.error("onCatererChange error:", err);
      }
    }

    // ─── Render Menu ─────────────────────────────────────────────────────────────
    function renderMenu(items, catererName) {
      const menuSection = document.getElementById("menuSection");

      // Group items by category
      const grouped = {};
      items.forEach(item => {
        if (!item.available) return; // Skip unavailable items
        const cat = item.category || "Other";
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(item);
      });

      let html = `<h3 style="color:#8e24aa; margin-top:20px;">${catererName ? catererName + "'s Menu" : "Menu"}</h3>`;

      Object.entries(grouped).forEach(([category, items]) => {
        html += `<div class="category-header">${category}</div>`;
        items.forEach(item => {
          html += `
            <div class="menu-item">
              <div class="menu-item-info">
                <span class="menu-item-name">${item.name}</span>
                ${item.description ? `<span class="menu-item-desc">${item.description}</span>` : ''}
              </div>
              <span class="menu-item-price">₹${item.price.toFixed(2)}</span>
              <button onclick="addToCart(${item.id}, '${escapeHtml(item.name)}', ${item.price})">Add to Cart</button>
            </div>`;
        });
      });

      menuSection.innerHTML = html;
    }

    // ─── Cart Functions ───────────────────────────────────────────────────────────
    function addToCart(itemId, name, price) {
      const locationCode = document.getElementById("location").value;
      const locationObj = locationsData.find(l => l.code === locationCode);
      const locationName = locationObj ? locationObj.name : locationCode;
      const catererName = selectedCatererObj ? selectedCatererObj.name : "";

      // Increment quantity if same item from same caterer is already in cart
      const existing = cart.find(i => i.itemId === itemId && i.caterer === catererName);
      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
      } else {
        cart.push({
          itemId,
          name,
          price,
          quantity: 1,
          location: locationName,
          caterer: catererName
        });
      }

      updateCartDisplay();
    }

    function updateCartDisplay() {
      const cartItems = document.getElementById("cartItems");
      const totalDisplay = document.getElementById("total");
      cartItems.innerHTML = "";
      let total = 0;

      cart.forEach(item => {
        const qty = item.quantity || 1;
        const li = document.createElement("li");
        li.textContent = `${item.name} x${qty} — ₹${(item.price * qty).toFixed(2)}`;
        cartItems.appendChild(li);
        total += item.price * qty;
      });

      totalDisplay.textContent = total.toFixed(2);

      // Persist to localStorage — key: 'cart', same key read by mycart.html
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    // ─── Place Order ─────────────────────────────────────────────────────────────
    function placeOrder() {
      const locationCode = document.getElementById("location").value;
      const catererSelect = document.getElementById("caterers");
      const catererName = selectedCatererObj ? selectedCatererObj.name : catererSelect.options[catererSelect.selectedIndex]?.text || "";

      if (!locationCode || !catererName || cart.length === 0) {
        alert("Please select a location, caterer, and add items to your cart before placing an order.");
        return;
      }

      const locationObj = locationsData.find(l => l.code === locationCode);
      const locationName = locationObj ? locationObj.name : locationCode;

      const orderData = {
        location: locationName,
        caterer: catererName,
        items: cart,
        totalAmount: cart.reduce((total, item) => total + item.price * (item.quantity || 1), 0),
      };

      fetch('/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData),
      })
      .then(response => {
        if (!response.ok) throw new Error(`Order failed: ${response.status}`);
        return response.json();
      })
      .then(data => {
        const orderId = data.id || data.orderId || "";
        alert(`✅ Order placed successfully!${orderId ? " Order ID: #" + orderId : ""}`);
        cart = [];
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartDisplay();
      })
      .catch(error => {
        console.error('Error placing order:', error);
        alert("There was an issue placing your order. Please try again.");
      });
    }

    // ─── Utility ─────────────────────────────────────────────────────────────────
    function escapeHtml(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
